[package]
name = "cayrn-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cayrn-protocol = { path = "../protocol", features = ["wire"] }
cayrn-client = { path = "../client" }
cayrn-host = { path = "../host" }
tokio.workspace = true
serde_json.workspace = true
clap.workspace = true

[lints]
workspace = true

[[bin]]
name = "cayrn"
path = "src/main.rs"

# These features select external-runtime test targets, never production behavior.
[features]
native-integration = []
xrepl-integration = ["native-integration", "dep:portable-pty"]

[dependencies.portable-pty]
version = "0.9"
optional = true

[dev-dependencies]
tempfile.workspace = true
uuid.workspace = true
rusqlite.workspace = true

[[test]]
name = "native_agent"
path = "tests/native_agent.rs"
required-features = ["native-integration"]

[[test]]
name = "xrepl"
path = "tests/xrepl.rs"
required-features = ["xrepl-integration"]
